server.port=8081
spring.application.name=prosumer-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/prosumer_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Kishore@180711
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
