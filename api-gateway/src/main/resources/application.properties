spring.application.name=api-gateway
server.port=8080

# Prosumer Route with JWT Protection
spring.cloud.gateway.routes[0].id=prosumer-service-route
spring.cloud.gateway.routes[0].uri=lb://PROSUMER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/prosumers/**
spring.cloud.gateway.routes[0].filters[0]=JwtAuthenticationFilter

# Telemetry Route with JWT Protection
spring.cloud.gateway.routes[1].id=telemetry-service-route
spring.cloud.gateway.routes[1].uri=lb://TELEMETRY-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/telemetry/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthenticationFilter

# Matching Route with JWT Protection
spring.cloud.gateway.routes[2].id=matching-service-route
spring.cloud.gateway.routes[2].uri=lb://MATCHING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/matching/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthenticationFilter

# Settlement Route with JWT Protection
spring.cloud.gateway.routes[3].id=settlement-service-route
spring.cloud.gateway.routes[3].uri=lb://SETTLEMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/settlement/**
spring.cloud.gateway.routes[3].filters[0]=JwtAuthenticationFilter

# Eureka Registration Settings
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
# Expose health and info endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always